name: renzai

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in deploy/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - redis-data:/data
    networks: [data]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    env_file: ["${RENZAI_ENV_FILE:-deploy/.env}"]
    command: ["sh", "-ec", "python scripts/validate_deployment_env.py && alembic upgrade head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  renzai-api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    env_file: ["${RENZAI_ENV_FILE:-deploy/.env}"]
    environment:
      FORWARDED_ALLOW_IPS: ${RENZAI_FORWARDED_ALLOW_IPS:-172.16.0.0/12}
      RENZAI_OBSERVABILITY_SERVICE_NAME: renzai-api
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [application, data, observability]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped

  renzai-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    env_file: ["${RENZAI_ENV_FILE:-deploy/.env}"]
    environment:
      RENZAI_OBSERVABILITY_SERVICE_NAME: renzai-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [application, data, observability]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped

  renzai-web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    environment:
      RENZAI_API_ORIGIN: http://renzai-api:8000
    depends_on:
      renzai-api:
        condition: service_healthy
    networks: [edge, application]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:1.29.1-alpine
    depends_on:
      renzai-api:
        condition: service_healthy
      renzai-web:
        condition: service_healthy
    ports:
      - "${RENZAI_HTTP_BIND:-127.0.0.1}:${RENZAI_HTTP_PORT:-8080}:8080"
    volumes:
      - ./infrastructure/nginx/renzai.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge, application]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    profiles: [observability]
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data, observability]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.79.0-alpine
    profiles: [observability]
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks: [data, observability]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.138.0
    profiles: [observability]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infrastructure/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks: [observability]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.6.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      renzai-api:
        condition: service_healthy
      renzai-worker:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started
    networks: [observability]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?set GF_SECURITY_ADMIN_USER in deploy/.env}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in deploy/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${RENZAI_GRAFANA_BIND:-127.0.0.1}:${RENZAI_GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    networks: [observability, management]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

networks:
  edge:
  application:
  data:
    internal: true
  observability:
    internal: true
  management:

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
