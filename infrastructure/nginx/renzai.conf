map $http_x_request_id $renzai_request_id {
    "~^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" $http_x_request_id;
    default $request_id;
}

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 1m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 65s;

    proxy_http_version 1.1;
    proxy_request_buffering on;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $renzai_request_id;
    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $renzai_request_id always;

    location = /health {
        proxy_pass http://renzai-api:8000;
        proxy_read_timeout 10s;
    }

    location = /ready {
        proxy_pass http://renzai-api:8000;
        proxy_read_timeout 10s;
    }

    location ^~ /api/ {
        proxy_pass http://renzai-api:8000;
        proxy_read_timeout 65s;
    }

    location = /v1/chat/completions {
        proxy_pass http://renzai-api:8000;
        proxy_read_timeout 65s;
    }

    location / {
        proxy_pass http://renzai-web:3000;
        proxy_read_timeout 30s;
    }
}
