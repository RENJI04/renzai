global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: renzai-api
    metrics_path: /metrics
    static_configs:
      - targets: [renzai-api:8000]

  - job_name: renzai-worker
    static_configs:
      - targets: [renzai-worker:9108]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
