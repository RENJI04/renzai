name: Feature request
description: Propose a scoped product or developer-experience improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user/operator problem without prescribing a large solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful proposal
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security, privacy, tenancy, and compatibility impact
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
