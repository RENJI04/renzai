name: Bug report
description: Report a reproducible Renzai defect using synthetic data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, personal data, prompt content, or vulnerability details. Use private security reporting for security issues.
  - type: input
    id: commit
    attributes:
      label: Commit or version
      placeholder: git rev-parse HEAD
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Include safe commands and sanitized logs only.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [API, Web, Worker, Python SDK, TypeScript SDK, Database, Redis, Compose, Observability, Documentation]
    validations:
      required: true
